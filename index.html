<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Optimizer 🚀</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Process Optimizer AI ✨</h1>
        <p>Analizează un proces pentru a găsi oportunități de automatizare.</p>
    </header>

    <main>
        <form id="analiza-form">
            <textarea id="proces-input" rows="10" placeholder="Descrie pas cu pas procesul pe care dorești să-l optimizezi..."></textarea>
            <button type="submit">Analizează Procesul</button>
        </form>

        <section id="rezultate">
            <h2>Rezultatele analizei vor apărea aici.</h2>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Process Optimization App</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
